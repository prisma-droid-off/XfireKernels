name: Build Kernel Action

permissions:
    contents: write

on:
  workflow_dispatch:
    inputs:
      cache:
        description: 'Enable CCache'
        required: true
        type: boolean
        default: true
      MAKE_RELEASE:
        description: 'Create a GitHub Release'
        required: true
        type: boolean
        default: true
      BASE_BRANCH:
        description: 'Branch to build'
        type: string
        required: false
        default: main

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.BASE_BRANCH }}
          persist-credentials: false
          submodules: 'recursive'
          fetch-tags: true
          fetch-depth: 1

      - name: Determine Next Version
        id: version
        run: |
          git fetch --tags || true
          LATEST_TAG=$(git tag -l "v*.*" | sort -V | tail -n 1)

          if [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="1.1"
          else
            CLEAN_VER="${LATEST_TAG#v}"
            MAJOR=$(echo "$CLEAN_VER" | cut -d. -f1)
            MINOR=$(echo "$CLEAN_VER" | cut -d. -f2)
            NEW_MINOR=$((MINOR + 1))
            NEW_VERSION="${MAJOR}.${NEW_MINOR}"
          fi

          echo "Latest tag found: ${LATEST_TAG:-None}"
          echo "New incremental version: $NEW_VERSION"
          echo "kernel_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update BakaSU
        run: |
          cd KernelSU
          git fetch --unshallow --tags origin || git fetch --tags origin
          git checkout --detach origin/main

      - name: Setup CCache Environment
        if: github.event.inputs.cache == 'true'
        run: |
          sudo apt update && sudo apt install -y ccache
          CACHE_DIR="${{ github.workspace }}/.ccache"
          mkdir -p "$CACHE_DIR"
          SETTINGS=(
            "CCACHE_DIR=$CACHE_DIR"
            "CCACHE_MAXSIZE=4G"
            "CCACHE_COMPILERCHECK=content"
            "CCACHE_BASEDIR=${GITHUB_WORKSPACE}"
            "CCACHE_NOHASHDIR=true"
            "CCACHE_IGNOREOPTIONS=-sysroot* -fdebug-prefix-map=* -fmacro-prefix-map=*"
            "CCACHE_COMPRESS=true"
            "CCACHE_COMPRESSLEVEL=8"
            "CCACHE_DIRECT=true"
            "CCACHE_FILE_CLONE=true"
            "CCACHE_INODE_CACHE=true"
            "CCACHE_IS_KERNEL_COMPILING=true"
            "CCACHE_UMASK=002"
            "KBUILD_BUILD_TIMESTAMP=2026-01-01"
            "CCACHE_SLOPPINESS=file_macro,time_macros,include_file_mtime,include_file_ctime,pch_defines,system_headers,locale,file_stat_matches"
          )

          for setting in "${SETTINGS[@]}"; do
            export "$setting"
            echo "$setting" >> $GITHUB_ENV
          done

          if ccache --help 2>&1 | grep -q 'depend_mode'; then
              export CCACHE_DEPEND=true
              echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
          fi

          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Cache CCache Files
        if: github.event.inputs.cache == 'true'
        uses: actions/cache/restore@v4
        with:
           path: ${{ github.workspace }}/.ccache
           key: ccache-${{ runner.os }}-${{ inputs.BASE_BRANCH }}-${{ github.run_id }}
           restore-keys: |
             ccache-${{ runner.os }}-${{ inputs.BASE_BRANCH }}-

      - name: Build Kernel && Images
        run: |
          if [ "${{ github.event.inputs.cache }}" = "true" ]; then
            ccache -s
          fi

          bash "$GITHUB_WORKSPACE"/build.sh

          if [ -f "build/Image" ]; then
            cp "$GITHUB_WORKSPACE"/build/Image ./Image
          else
            echo "ERRO: Image não encontrada em build/Image"
            exit 1
          fi
          
          # == vendor_boot && dlkm packing
          mkdir -p ${GITHUB_WORKSPACE}/artifacts
          
          # this will creat built_vendor && buitl_dlkm folders
          bash "$GITHUB_WORKSPACE"/lkm-tools/run.sh
          
          cd "$GITHUB_WORKSPACE"/boot_editor_v15_r1
          echo "== WORKING DIR =="
          pwd
          
          cd "$GITHUB_WORKSPACE"/boot_editor_v15_r1

          # unpack the stock vendor_boot so build/unzip_boot/ exists
          ./gradlew unpack

          # replace vendor modules
          rm -fr build/unzip_boot/root.2/lib/modules/*
          mkdir -p build/unzip_boot/root.2/lib/modules
          chmod 744 "$GITHUB_WORKSPACE"/built_vendor/*
          cp "$GITHUB_WORKSPACE"/built_vendor/* build/unzip_boot/root.2/lib/modules/

          ./gradlew pack 
          cp vendor_boot.img.signed "$GITHUB_WORKSPACE"/artifacts/vendor_boot.img
    
          # == vendor_dlkm packing
          
          # nuke vboot
          ./gradlew clear && ./gradlew clean
          
          # cp vlkm and unpack
          cp "$GITHUB_WORKSPACE"/lkm-tools/vendor_dlkm/vendor_dlkm.img .
          ./gradlew unpack
          
          # mount vendor_lkm 
          sudo mount vendor_dlkm.img -o loop -t erofs build/unzip_boot/mount
          
          sudo mkdir -p build/unzip_boot/vendor_dlkm && sudo cp -r build/unzip_boot/mount/* build/unzip_boot/vendor_dlkm
          
          #fix permissions, replace modules and pack
          chmod 744 "$GITHUB_WORKSPACE"/built_dlkm/*
          
          sudo cp "$GITHUB_WORKSPACE"/built_dlkm/* "$GITHUB_WORKSPACE"/boot_editor_v15_r1/build/unzip_boot/vendor_dlkm/lib/modules
          
          sudo umount vendor_dlkm.img
          
          ./gradlew pack
          
      - name: Save CCache Files
        if: ${{ always() && github.event.inputs.cache == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ inputs.BASE_BRANCH }}-${{ github.run_id }}

      - name: Package Artifacts
        run: |
          set -euo pipefail
          
          # AnyKernel3
          git clone --depth=1 https://github.com/prisma-droid-off/AnyKernel3.git ${GITHUB_WORKSPACE}/AnyKernel3

          if [ -f "${GITHUB_WORKSPACE}/Image" ]; then
            cp "${GITHUB_WORKSPACE}/Image" "${GITHUB_WORKSPACE}/AnyKernel3/"
          else
            echo "[x] Kernel Image not found!"
            exit 1
          fi

          cd ${GITHUB_WORKSPACE}/AnyKernel3
          rm -rf .git README.md

          XfireKernels="XfireKernels_v${{ steps.version.outputs.kernel_version }}.zip"
          zip -r9 "${GITHUB_WORKSPACE}/artifacts/${XfireKernels}" ./*
          
          # vboot_modules
          cd ${GITHUB_WORKSPACE}
          zip -r vboot_modules.zip "${GITHUB_WORKSPACE}"/built_vendor
          cp vboot_modules.zip ${GITHUB_WORKSPACE}/artifacts/
          
          # vdlkm_modules
          zip -r vdlkm_modules.zip "${GITHUB_WORKSPACE}"/built_dlkm
          cp vdlkm_modules.zip ${GITHUB_WORKSPACE}/artifacts/
          
          # vendor_dlkm.img
          cp ./boot_editor_v15_r1/vendor_dlkm.img.signed ${GITHUB_WORKSPACE}/artifacts/vendor_dlkm.img
          

      - name: GitHub Release
        if: github.event.inputs.MAKE_RELEASE == 'true'
        uses: softprops/action-gh-release@v3
        with:
          name: Xfire Kernels v${{ steps.version.outputs.kernel_version }}
          tag_name: v${{ steps.version.outputs.kernel_version }}
          body: |
            > [!WARNING]
            > **DISCLAIMER:** I am not responsible for bricks, or anything of kind. Flash at your own risk! 

            *Kernel Version: v${{ steps.version.outputs.kernel_version }}*
            *Compiled using: clang-r450784e (LLVM)*
            *This release was automatically generated by GitHub Actions.*
          files: |
            ${{ github.workspace }}/artifacts/*
        env:
            GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
